name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP — PHPStan L8 · PHPUnit · guardrails
    runs-on: ubuntu-latest
    # Checked out INTO the WordPress plugins layout so arch-guardrails.sh
    # resolves its sibling-plugin paths (scripts/../../<plugin>).
    defaults:
      run:
        working-directory: app/public/wp-content/plugins/bcc-trust
    steps:
      - uses: actions/checkout@v4
        with:
          path: app/public/wp-content/plugins/bcc-trust

      # bcc-trust's phpstan.neon scans ../bcc-core/src for cross-plugin type
      # resolution (ServiceLocator, DB helpers, logging). Check out the public
      # sibling into the WP layout so the path resolves.
      - uses: actions/checkout@v4
        with:
          repository: simontx1983/bcc-core
          path: app/public/wp-content/plugins/bcc-core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # gmp is required by simplito/elliptic-php (on-chain crypto).
          extensions: gmp, mbstring, intl
          tools: composer:v2
          coverage: none

      # composer.lock is gitignored in this repo (production vendor/ is committed,
      # dev deps restored on demand), so resolve from composer.json.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHPStan (level 8)
        run: composer phpstan

      - name: Unit tests
        run: composer test

      - name: Architecture guardrails (incl. PHP syntax)
        run: bash scripts/arch-guardrails.sh bcc-trust

      # verify-golden.sh itself needs a live WordPress + seeded DB, which CI
      # has not got — which is exactly why it was in no workflow, and why its
      # fixtures rotted unnoticed for months (foreman_insignia from v1.36,
      # card_tier from v1.57, a manifest still pinning the v1.55-retired
      # /locals). This guard catches that whole class statically, so the rot
      # cannot come back silently.
      - name: Golden-fixture staleness guard
        run: php scripts/golden-staleness-guard.php

      # scripts/intent-guard.sh cannot run in CI (it needs a live WordPress and
      # a seeded DB), which is how it shipped three defects that produced green
      # runs having checked nothing: `command -v` matching the script's own jq
      # wrapper, `done < <(...)` iterating zero times on a host with no /dev/fd,
      # and a closing test of `bad == 0` that a zero-iteration loop satisfies.
      # This harness needs neither WordPress nor a DB — it replays captured
      # payloads through a `wp` shim — so the guard's own logic can be pinned
      # here even though the guard cannot be.
      #
      # The suite has two legs. The php leg always runs. The jq leg only runs
      # when a REAL jq binary is present, and it is the leg that checks the php
      # parity implementation against jq's actual bytes and exit statuses — so
      # a jq-less runner would print ALL GREEN for roughly half the suite. Both
      # tools are therefore asserted with `type -P` (PATH executables only,
      # never a function or alias — the exact distinction this PR family
      # exists over), and both the assertion total and the jq-oracle skip count
      # are pinned so a smaller green cannot pass for a complete one.
      - name: Intent-guard prerequisite + jq-parity harness
        run: |
          set -uo pipefail

          # Same number here and on the dev host: the only environment-
          # dependent case is 11c, which masks /dev/fd and needs a mount
          # namespace it can establish — neither Git Bash nor this runner can,
          # so it skips on both and the static half of case 11 carries it.
          # Update this deliberately when the harness gains or loses
          # assertions: it is the only thing standing between "the suite
          # passed" and "some of the suite passed".
          EXPECTED_ASSERTIONS=466

          JQ_BIN="$(type -P jq || true)"
          PHP_BIN="$(type -P php || true)"
          if [ -z "$JQ_BIN" ]; then
            echo "::error::no jq EXECUTABLE on PATH (type -P jq found nothing). Half of this"
            echo "::error::suite is jq-vs-php parity and cannot run without one."
            exit 1
          fi
          if [ -z "$PHP_BIN" ]; then
            echo "::error::no php EXECUTABLE on PATH (type -P php found nothing)."
            exit 1
          fi
          echo "jq  : $JQ_BIN  ($("$JQ_BIN" --version))"
          echo "php : $PHP_BIN ($("$PHP_BIN" -r 'echo PHP_VERSION;'))"

          LOG="$RUNNER_TEMP/intent-guard-harness.log"
          HARNESS_RC=0
          bash scripts/tests/intent-guard-prereq.test.sh 2>&1 | tee "$LOG" || HARNESS_RC=$?
          if [ "$HARNESS_RC" -ne 0 ]; then
            echo "::error::intent-guard harness exited $HARNESS_RC — see the assertions above"
            exit "$HARNESS_RC"
          fi

          ACTUAL="$(sed -n 's/^ALL GREEN[^0-9]*\([0-9][0-9]*\) assertion(s).*/\1/p' "$LOG" | tail -1)"
          if [ "$ACTUAL" != "$EXPECTED_ASSERTIONS" ]; then
            echo "::error::harness ran $ACTUAL assertion(s), expected $EXPECTED_ASSERTIONS."
            echo "::error::A LOWER number means part of the suite silently did not run —"
            echo "::error::the two legs that can drop out are the jq oracle (see the ORACLE"
            echo "::error::line) and case 11c, which masks /dev/fd and needs a usable mount"
            echo "::error::namespace. A HIGHER number means assertions were added and this"
            echo "::error::pin was not updated with them."
            exit 1
          fi
          echo "assertions : $ACTUAL (expected $EXPECTED_ASSERTIONS)"

          ORACLE="$(grep -E '^ORACLE ' "$LOG" | tail -1 || true)"
          if [ -z "$ORACLE" ]; then
            echo "::error::harness printed no ORACLE line; cannot tell how much of it ran."
            exit 1
          fi
          COMPARISONS="${ORACLE#*jq_comparisons=}"; COMPARISONS="${COMPARISONS%% *}"
          SKIPPED="${ORACLE##*skipped=}"
          echo "oracle     : $ORACLE"
          if [ "$SKIPPED" != "0" ]; then
            echo "::error::$SKIPPED jq-oracle comparison(s) were skipped — the php parity"
            echo "::error::implementation was not checked against real jq everywhere."
            exit 1
          fi
          if [ "$COMPARISONS" -lt 1 ]; then
            echo "::error::zero jq-oracle comparisons ran; the jq leg did not execute."
            exit 1
          fi

  integration:
    name: PHP integration (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=15
    defaults:
      run:
        working-directory: app/public/wp-content/plugins/bcc-trust
    env:
      BCC_TEST_DB_HOST: 127.0.0.1
      BCC_TEST_DB_PORT: '3306'
      BCC_TEST_DB_USER: root
      BCC_TEST_DB_PASS: root
      BCC_TEST_DB_NAME: bcc_test
    steps:
      - uses: actions/checkout@v4
        with:
          path: app/public/wp-content/plugins/bcc-trust

      # The integration bootstrap requires bcc-core's DB.php (table-name
      # resolution for the claims/validators/collections/wallet_links
      # schemas) — same adjacent checkout the phpstan job uses.
      - uses: actions/checkout@v4
        with:
          repository: simontx1983/bcc-core
          path: app/public/wp-content/plugins/bcc-core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gmp, mbstring, mysqli
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Integration tests (real $wpdb vs MySQL)
        run: composer test:integration
