name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP — PHPStan L8 · PHPUnit · guardrails
    runs-on: ubuntu-latest
    # Checked out INTO the WordPress plugins layout so arch-guardrails.sh
    # resolves its sibling-plugin paths (scripts/../../<plugin>).
    defaults:
      run:
        working-directory: app/public/wp-content/plugins/bcc-trust
    steps:
      - uses: actions/checkout@v4
        with:
          path: app/public/wp-content/plugins/bcc-trust

      # bcc-trust's phpstan.neon scans ../bcc-core/src for cross-plugin type
      # resolution (ServiceLocator, DB helpers, logging). Check out the public
      # sibling into the WP layout so the path resolves.
      - uses: actions/checkout@v4
        with:
          repository: simontx1983/bcc-core
          path: app/public/wp-content/plugins/bcc-core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # gmp is required by simplito/elliptic-php (on-chain crypto).
          #
          # ⚠ imagick is here for ONE suite, and its absence does not fail
          # that suite — it SKIPS it. CoverImageMetadataStripBehaviourTest is the
          # only place the cover-image EXIF/GPS strip is proven to remove
          # BYTES rather than merely to have been attempted, and the Imagick
          # branch is the only one reachable without loading WordPress. Drop
          # this extension and the privacy control silently stops being
          # tested, which is why the step below re-runs that suite with
          # --fail-on-skipped.
          extensions: gmp, mbstring, intl, imagick
          tools: composer:v2
          coverage: none

      # ⚠ BEFORE `composer install`, and deliberately so. The committed vendor/ is
      # what the deploy rsyncs to staging and production; installing first would
      # rewrite the classmap in the runner and the guard would then pass over
      # freshly written files instead of the ones this commit actually ships.
      - name: Composer classmap parity (committed vendor, pre-install)
        run: php scripts/composer-classmap-guard.php

      # ⚠ `install`, NOT `update` — changed in #191, and the distinction is the
      # whole point of that issue. composer.lock is now COMMITTED, so `install`
      # reproduces exactly the set the deploy ships. `update` re-resolved on
      # every run, which is how CI came to be testing guzzle 7.16.1 and
      # brick/math 1.0.0 while production ran 7.10.0 and 0.17.1 — drift that
      # nothing reported, because neither side ever looked at the other.
      #
      # If this step ever fails with "lock file is not up to date", the fix is
      # to run `composer update` locally and commit the lock as its own change.
      # Do NOT switch this back to `update` to make it green.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan (level 8)
        run: composer phpstan

      - name: Unit tests
        run: composer test

      # ⚠⚠ A SKIPPED TEST READS AS A PASSING TEST. The EXIF-strip suite
      # skips itself when imagick is absent — correct on a developer machine,
      # wrong here, because this job is the only place that strip is proven to
      # remove BYTES rather than merely to have been attempted.
      #
      # TWO flags, closing two DIFFERENT false greens, both measured:
      #
      #   --fail-on-skipped          without imagick the suite prints
      #                              "OK, but some tests were skipped!" and
      #                              exits 0. Measured: plain 0, flagged 1.
      #   --fail-on-empty-test-suite a --filter that matches NOTHING prints
      #                              "No tests executed!" and also exits 0,
      #                              so renaming or deleting the class would
      #                              silently retire this guard. Measured:
      #                              bogus filter 0 plain, 1 flagged.
      #
      # Neither flag substitutes for the other: a real filter with no imagick
      # still exits 0 under --fail-on-empty-test-suite alone.
      - name: Cover-image EXIF strip actually ran (not skipped, not vanished)
        run: |
          vendor/bin/phpunit --filter CoverImageMetadataStripBehaviourTest \
            --fail-on-skipped --fail-on-empty-test-suite

      - name: Architecture guardrails (incl. PHP syntax)
        run: bash scripts/arch-guardrails.sh bcc-trust

      # ⚠⚠⚠ Armed 2026-09-30 after a live Alchemy API key was printed by a
      # diagnostic and had to be rotated. The redactor in use masked the query
      # string only; Alchemy carries its key in the PATH, and
      # AlchemyEndpoint::nftBaseFromRpcUrl() rewrites that path into
      # /nft/v3/<KEY> — a shape nobody had enumerated. The code was reviewed and
      # the redactor's own docblock described the gap; neither caught it, because
      # the defect was one line pairing a value with an output.
      #
      # Blocking from the first run: the tree is clean, so there is no backlog to
      # work down and nothing to ratchet. See security issue #267.
      - name: Endpoint-exposure guard (no credential reaches an output)
        run: php scripts/endpoint-exposure-guard.php

      # The guard above is the kind that can silently match nothing and report a
      # pass — this repo has shipped exactly that failure before. These controls
      # inject each leak shape into real production code and require the guard or
      # the named test to FAIL, so a guard that stopped detecting anything turns
      # the build red instead of green.
      - name: Endpoint redaction / identity mutation controls
        run: bash scripts/tests/endpoint-redaction-mutation-controls.sh

      # The credential-source half of issue #267. Two of these controls pin
      # changes that would otherwise read as improvements: mapping every seeded
      # Alchemy network (which silently launches Polygon, Arbitrum and Optimism,
      # because nothing else gates them) and routing standard JSON-RPC through the
      # Alchemy resolver (which removes ERC-721 gating from Avalanche and BSC).
      - name: Alchemy credential-source mutation controls
        run: bash scripts/tests/alchemy-credential-mutation-controls.sh

      # verify-golden.sh itself needs a live WordPress + seeded DB, which CI
      # has not got — which is exactly why it was in no workflow, and why its
      # fixtures rotted unnoticed for months (foreman_insignia from v1.36,
      # card_tier from v1.57, a manifest still pinning the v1.55-retired
      # /locals). This guard catches that whole class statically, so the rot
      # cannot come back silently.
      - name: Golden-fixture staleness guard
        run: php scripts/golden-staleness-guard.php

      # scripts/intent-guard.sh cannot run in CI (it needs a live WordPress and
      # a seeded DB), which is how it shipped three defects that produced green
      # runs having checked nothing: `command -v` matching the script's own jq
      # wrapper, `done < <(...)` iterating zero times on a host with no /dev/fd,
      # and a closing test of `bad == 0` that a zero-iteration loop satisfies.
      # This harness needs neither WordPress nor a DB — it replays captured
      # payloads through a `wp` shim — so the guard's own logic can be pinned
      # here even though the guard cannot be.
      #
      # The suite has two legs. The php leg always runs. The jq leg only runs
      # when a REAL jq binary is present, and it is the leg that checks the php
      # parity implementation against jq's actual bytes and exit statuses — so
      # a jq-less runner would print ALL GREEN for roughly half the suite. Both
      # tools are therefore asserted with `type -P` (PATH executables only,
      # never a function or alias — the exact distinction this PR family
      # exists over), and both the assertion total and the jq-oracle skip count
      # are pinned so a smaller green cannot pass for a complete one.
      - name: Intent-guard prerequisite + jq-parity harness
        run: |
          set -uo pipefail

          # Same number here and on the dev host: the only environment-
          # dependent case is 11c, which masks /dev/fd and needs a mount
          # namespace it can establish — neither Git Bash nor this runner can,
          # so it skips on both and the static half of case 11 carries it.
          # Update this deliberately when the harness gains or loses
          # assertions: it is the only thing standing between "the suite
          # passed" and "some of the suite passed".
          EXPECTED_ASSERTIONS=466

          JQ_BIN="$(type -P jq || true)"
          PHP_BIN="$(type -P php || true)"
          if [ -z "$JQ_BIN" ]; then
            echo "::error::no jq EXECUTABLE on PATH (type -P jq found nothing). Half of this"
            echo "::error::suite is jq-vs-php parity and cannot run without one."
            exit 1
          fi
          if [ -z "$PHP_BIN" ]; then
            echo "::error::no php EXECUTABLE on PATH (type -P php found nothing)."
            exit 1
          fi
          echo "jq  : $JQ_BIN  ($("$JQ_BIN" --version))"
          echo "php : $PHP_BIN ($("$PHP_BIN" -r 'echo PHP_VERSION;'))"

          LOG="$RUNNER_TEMP/intent-guard-harness.log"
          HARNESS_RC=0
          bash scripts/tests/intent-guard-prereq.test.sh 2>&1 | tee "$LOG" || HARNESS_RC=$?
          if [ "$HARNESS_RC" -ne 0 ]; then
            echo "::error::intent-guard harness exited $HARNESS_RC — see the assertions above"
            exit "$HARNESS_RC"
          fi

          ACTUAL="$(sed -n 's/^ALL GREEN[^0-9]*\([0-9][0-9]*\) assertion(s).*/\1/p' "$LOG" | tail -1)"
          if [ "$ACTUAL" != "$EXPECTED_ASSERTIONS" ]; then
            echo "::error::harness ran $ACTUAL assertion(s), expected $EXPECTED_ASSERTIONS."
            echo "::error::A LOWER number means part of the suite silently did not run —"
            echo "::error::the two legs that can drop out are the jq oracle (see the ORACLE"
            echo "::error::line) and case 11c, which masks /dev/fd and needs a usable mount"
            echo "::error::namespace. A HIGHER number means assertions were added and this"
            echo "::error::pin was not updated with them."
            exit 1
          fi
          echo "assertions : $ACTUAL (expected $EXPECTED_ASSERTIONS)"

          ORACLE="$(grep -E '^ORACLE ' "$LOG" | tail -1 || true)"
          if [ -z "$ORACLE" ]; then
            echo "::error::harness printed no ORACLE line; cannot tell how much of it ran."
            exit 1
          fi
          COMPARISONS="${ORACLE#*jq_comparisons=}"; COMPARISONS="${COMPARISONS%% *}"
          SKIPPED="${ORACLE##*skipped=}"
          echo "oracle     : $ORACLE"
          if [ "$SKIPPED" != "0" ]; then
            echo "::error::$SKIPPED jq-oracle comparison(s) were skipped — the php parity"
            echo "::error::implementation was not checked against real jq everywhere."
            exit 1
          fi
          if [ "$COMPARISONS" -lt 1 ]; then
            echo "::error::zero jq-oracle comparisons ran; the jq leg did not execute."
            exit 1
          fi

  integration:
    name: PHP integration (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=15
    defaults:
      run:
        working-directory: app/public/wp-content/plugins/bcc-trust
    env:
      BCC_TEST_DB_HOST: 127.0.0.1
      BCC_TEST_DB_PORT: '3306'
      BCC_TEST_DB_USER: root
      BCC_TEST_DB_PASS: root
      BCC_TEST_DB_NAME: bcc_test
    steps:
      - uses: actions/checkout@v4
        with:
          path: app/public/wp-content/plugins/bcc-trust

      # The integration bootstrap requires bcc-core's DB.php (table-name
      # resolution for the claims/validators/collections/wallet_links
      # schemas) — same adjacent checkout the phpstan job uses.
      - uses: actions/checkout@v4
        with:
          repository: simontx1983/bcc-core
          path: app/public/wp-content/plugins/bcc-core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gmp, mbstring, mysqli
          tools: composer:v2
          coverage: none
      # `install`, not `update` — see the note in the php job above (#191).
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Integration tests (real $wpdb vs MySQL)
        run: composer test:integration

  # Production runs MariaDB 11.8, not MySQL 8, and the two engines do not
  # accept the same SQL. `FOR SHARE` is valid MySQL 8 and a parse error on
  # MariaDB: it passed the job above for months while production logged
  # 5,688 SQL errors a day and overwrote every page's read model with neutral
  # defaults. This job runs the engine-compatibility group against the
  # production engine AND production's server settings. It adds to the MySQL
  # job; it does not replace it.
  integration-mariadb:
    name: PHP integration (MariaDB 11.8 — production engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/public/wp-content/plugins/bcc-trust
    env:
      BCC_TEST_DB_HOST: 127.0.0.1
      BCC_TEST_DB_PORT: '3306'
      BCC_TEST_DB_USER: root
      BCC_TEST_DB_PASS: root
      BCC_TEST_DB_NAME: bcc_test
    steps:
      - uses: actions/checkout@v4
        with:
          path: app/public/wp-content/plugins/bcc-trust

      - uses: actions/checkout@v4
        with:
          repository: simontx1983/bcc-core
          path: app/public/wp-content/plugins/bcc-core

      # `docker run`, not a service container: services cannot pass server
      # arguments, and production's non-strict sql_mode and READ-COMMITTED
      # isolation are part of what is under test.
      - name: Start MariaDB 11.8.9 with production settings
        working-directory: .
        run: |
          docker run -d --name mariadb -p 3306:3306 -e MARIADB_ROOT_PASSWORD=root \
            mariadb:11.8.9 \
            --sql-mode=NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION \
            --transaction-isolation=READ-COMMITTED \
            --innodb-lock-wait-timeout=50 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 90); do
            if docker exec mariadb healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1; then
              echo "MariaDB ready after ${i}s"
              break
            fi
            sleep 1
          done
          docker exec mariadb mariadb -uroot -proot -e \
            "SELECT VERSION(), @@GLOBAL.sql_mode, @@GLOBAL.transaction_isolation, @@GLOBAL.innodb_lock_wait_timeout"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gmp, mbstring, mysqli
          tools: composer:v2
          coverage: none
      # `install`, not `update` — see the note in the php job above (#191).
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Integration tests — MariaDB compatibility group
        run: |
          vendor/bin/phpunit -c phpunit-integration.xml.dist --group mariadb \
            --fail-on-empty-test-suite --log-junit "$RUNNER_TEMP/mariadb-junit.xml"
          # A group filter that matches nothing must not pass as a green run.
          php -r '$n = count(simplexml_load_file($argv[1])->xpath("//testcase")); echo "MariaDB compatibility tests executed: {$n}\n"; exit($n >= 18 ? 0 : 1);' "$RUNNER_TEMP/mariadb-junit.xml"
